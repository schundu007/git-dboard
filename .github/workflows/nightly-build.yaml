# =============================================================================
# .github/workflows/nightly-build.yaml
#
# Purpose  : Nightly Build Pipeline
#            Builds Docker image variants across the full runtime version ×
#            image extension matrix on GPU self-hosted runners, runs smoke
#            tests, pushes to the image registry, exports Singularity .sif files
#            for HPC clusters, and posts a build summary to Slack.
#
# Image tag conventions:
#   Nightly : <registry>/<owner>/<repo>:nightly-YYYYMMDD-<ext>-sim<M.m>
#   SHA pin : <registry>/<owner>/<repo>:sha-<7char>-<ext>-sim<M.m>
#   Cache   : ghcr.io/<owner>/<repo>:cache-<ext>-sim<M.m>
#
# Runner label requirements (register on self-hosted runners):
#   self-hosted    — all GPU and Singularity runners
#   gpu            — GPU-capable runners
#   gpu-driver     — GPU driver ≥ 550 + CUDA 12.x  (real GPU runtime requirement)
#   gpu-a100-80gb  — A100 80 GB class  (base / ros2 / cloudxr)
#   gpu-a100-40gb  — A100 40 GB class  (slim)
#   singularity    — Apptainer / Singularity CLI installed
#
# Required secrets:
#   REGISTRY_USERNAME      Secondary registry username
#   REGISTRY_API_KEY       Secondary registry API key
#   HPC_STORAGE_ACCOUNT    Azure Blob storage account name
#   HPC_STORAGE_KEY        Azure Blob storage access key
#   SLACK_NIGHTLY_WEBHOOK  Slack incoming webhook URL
#   GITHUB_TOKEN           Automatic — no registration needed
# =============================================================================
name: "Nightly build"

on:
  schedule:
    - cron: "0 2 * * *"           # UTC 02:00 every day

  workflow_dispatch:
    inputs:
      sim_versions:
        description: "Isaac Sim versions — comma-separated or 'all'"
        required: false
        default: "all"
      image_exts:
        description: "Image extensions — comma-separated or 'all'"
        required: false
        default: "all"
      dry_run:
        description: "Build and test only — skip registry push"
        type: boolean
        required: false
        default: false
      skip_smoke_tests:
        description: "Skip container smoke tests (faster iteration)"
        type: boolean
        required: false
        default: false

# Never let two nightly runs on the same branch overlap.
concurrency:
  group: "nightly-${{ github.ref }}"
  cancel-in-progress: true

env:
  NGC_IMAGE:  "nvcr.io/nvidia/isaac-lab"
  GHCR_IMAGE: "ghcr.io/isaac-sim/isaaclab"
  PYTHON:     "3.11"

# =============================================================================
jobs:
# =============================================================================

  # ---------------------------------------------------------------------------
  # JOB 1 · setup
  # Resolve build matrix from dispatch inputs; stamp build date and git SHA.
  # ---------------------------------------------------------------------------
  setup:
    name: "Resolve matrix"
    runs-on: ubuntu-latest
    outputs:
      build_date:  ${{ steps.meta.outputs.build_date }}
      short_sha:   ${{ steps.meta.outputs.short_sha }}
      matrix:      ${{ steps.resolve.outputs.matrix }}
      cell_count:  ${{ steps.resolve.outputs.cell_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}

      - name: Generate build metadata
        id: meta
        run: |
          echo "build_date=$(date -u +'%Y%m%d')"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)"  >> "$GITHUB_OUTPUT"

      - name: Resolve build matrix
        id: resolve
        env:
          INPUT_SIM_VERSIONS: ${{ github.event.inputs.sim_versions }}
          INPUT_IMAGE_EXTS:   ${{ github.event.inputs.image_exts }}
        run: python3 docker/scripts/resolve-matrix.py

      - name: Print resolved matrix
        env:
          MATRIX: ${{ steps.resolve.outputs.matrix }}
        run: |
          echo "Build date : ${{ steps.meta.outputs.build_date }}"
          echo "Short SHA  : ${{ steps.meta.outputs.short_sha }}"
          echo "Cells      : ${{ steps.resolve.outputs.cell_count }}"
          echo "$MATRIX" | python3 -m json.tool


  # ---------------------------------------------------------------------------
  # JOB 2 · build
  # One runner per matrix cell. Each job builds, tests, and optionally pushes.
  # ---------------------------------------------------------------------------
  build:
    name: "Build [${{ matrix.cell_slug }}]"
    needs: setup
    runs-on: ${{ matrix.runner_labels }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    env:
      BUILD_DATE:        ${{ needs.setup.outputs.build_date }}
      SHORT_SHA:         ${{ needs.setup.outputs.short_sha }}
      RUNTIME_VERSION: ${{ matrix.runtime_version }}
      SIM_MAJOR_MINOR:   ${{ matrix.sim_major_minor }}
      IMAGE_EXT:         ${{ matrix.image_ext }}
      ACCEPT_EULA:       "Y"
      PRIVACY_CONSENT:   "Y"

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # ── Runner health ─────────────────────────────────────────────────────────
      - name: Verify GPU and NVIDIA container toolkit
        run: |
          echo "══ nvidia-smi ══════════════════════════════════════════"
          nvidia-smi \
            --query-gpu=name,memory.total,driver_version,cuda_version \
            --format=csv,noheader
          echo ""
          echo "══ NVIDIA container toolkit ════════════════════════════"
          dpkg -l nvidia-container-toolkit 2>/dev/null \
            || rpm -qa nvidia-container-toolkit 2>/dev/null \
            || echo "WARNING: nvidia-container-toolkit not found via package manager"

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            || true
          echo "Disk after cleanup:"
          df -h /

      # ── Registry auth ─────────────────────────────────────────────────────────
      - name: Log in to NVIDIA NGC
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: ${{ secrets.NGC_USERNAME }}
          password: ${{ secrets.NGC_API_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx ───────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: "network=host"

      # ── Compute tags ──────────────────────────────────────────────────────────
      - name: Compute image tags and dockerfile
        id: tags
        run: |
          chmod +x docker/scripts/nightly-tags.sh
          bash docker/scripts/nightly-tags.sh

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: "."
          file:    ${{ steps.tags.outputs.dockerfile }}
          push:    false
          load:    true
          tags:    ${{ steps.tags.outputs.all_tags }}
          build-args: |
            ISAACSIM_VERSION_ARG=${{ matrix.runtime_version }}
            IMAGE_EXT=${{ matrix.image_ext }}
            BUILD_DATE=${{ needs.setup.outputs.build_date }}
            GIT_SHA=${{ needs.setup.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/isaac-sim/IsaacLab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.setup.outputs.build_date }}
            com.nvidia.isaaclab.isaac-sim-version=${{ matrix.runtime_version }}
            com.nvidia.isaaclab.image-ext=${{ matrix.image_ext }}
            com.nvidia.isaaclab.build-type=nightly
          cache-from: |
            type=registry,ref=${{ steps.tags.outputs.ghcr_cache }}
          cache-to: |
            type=registry,ref=${{ steps.tags.outputs.ghcr_cache }},mode=max

      # ── Smoke tests ───────────────────────────────────────────────────────────
      - name: "Smoke · isaaclab import"
        if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
        run: |
          docker run --rm \
            --gpus all --runtime=nvidia \
            --ipc=host \
            -e ACCEPT_EULA -e PRIVACY_CONSENT \
            "${{ steps.tags.outputs.ngc_nightly }}" \
            bash -c "python -c 'import isaaclab; print(f\"isaaclab {isaaclab.__version__} — ok\")'"

      - name: "Smoke · Isaac Sim version pin"
        if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
        run: |
          REPORTED=$(docker run --rm \
            --gpus all --runtime=nvidia \
            -e ACCEPT_EULA -e PRIVACY_CONSENT \
            "${{ steps.tags.outputs.ngc_nightly }}" \
            bash -c "python -c 'import isaacsim; print(isaacsim.__version__)'" 2>&1 \
            | head -1 | tr -d '[:space:]')

          echo "Reported : $REPORTED"
          echo "Expected : ${{ matrix.runtime_version }}"

          if [[ "$REPORTED" != "${{ matrix.runtime_version }}"* ]]; then
            echo "::error::Isaac Sim version mismatch — got '$REPORTED', expected '${{ matrix.runtime_version }}'"
            exit 1
          fi
          echo "Version pin OK ✓"

      - name: "Smoke · ROS2 bridge (ros2 ext only)"
        if: >
          matrix.image_ext == 'ros2' &&
          github.event.inputs.skip_smoke_tests != 'true'
        run: |
          docker run --rm \
            --gpus all --runtime=nvidia \
            -e ACCEPT_EULA -e PRIVACY_CONSENT \
            "${{ steps.tags.outputs.ngc_nightly }}" \
            bash -c "source /opt/ros/humble/setup.bash && ros2 --version && echo 'ROS2 bridge ok'"

      - name: "Smoke · CloudXR runtime (cloudxr ext only)"
        if: >
          matrix.image_ext == 'cloudxr' &&
          github.event.inputs.skip_smoke_tests != 'true'
        run: |
          docker run --rm \
            --gpus all --runtime=nvidia \
            -e ACCEPT_EULA -e PRIVACY_CONSENT \
            "${{ steps.tags.outputs.ngc_nightly }}" \
            bash -c "ls /opt/cloudxr && echo 'CloudXR runtime present'"

      # ── Push ──────────────────────────────────────────────────────────────────
      - name: Push to NGC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          docker push "${{ steps.tags.outputs.ngc_nightly }}"
          docker push "${{ steps.tags.outputs.ngc_sha }}"
          echo "NGC push complete ✓"

      - name: Push to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          docker push "${{ steps.tags.outputs.ghcr_nightly }}"
          docker push "${{ steps.tags.outputs.ghcr_sha }}"
          echo "GHCR push complete ✓"

      # ── Cell manifest ─────────────────────────────────────────────────────────
      - name: Write cell manifest
        if: always()
        run: |
          case "${{ job.status }}" in
            success)   STATUS="success"   ;;
            failure)   STATUS="failure"   ;;
            cancelled) STATUS="cancelled" ;;
            *)         STATUS="unknown"   ;;
          esac

          DIGEST=$(docker inspect "${{ steps.tags.outputs.ngc_nightly }}" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null \
            | awk -F'@' '{print $2}' || echo "unavailable")

          SIZE_BYTES=$(docker inspect "${{ steps.tags.outputs.ngc_nightly }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")

          SIZE_MB=$(python3 -c "print(round(${SIZE_BYTES} / 1048576, 1))")

          SLUG="${{ matrix.image_ext }}-sim${{ matrix.runtime_version }}"

          python3 - <<'PYEOF'
          import json, os
          cell = {
              "runtime_version": os.environ["RUNTIME_VERSION"],
              "image_ext":         os.environ["IMAGE_EXT"],
              "nightly_tag":       "${{ steps.tags.outputs.nightly_tag }}",
              "sha_tag":           "${{ steps.tags.outputs.sha_tag }}",
              "registry_image":         "${{ steps.tags.outputs.ngc_nightly }}",
              "ghcr_image":        "${{ steps.tags.outputs.ghcr_nightly }}",
              "digest":            os.environ.get("DIGEST", "unavailable"),
              "size_mb":           float(os.environ.get("SIZE_MB", "0")),
              "runner":            "${{ runner.name }}",
              "dry_run":           "${{ github.event.inputs.dry_run }}" == "true",
              "status":            os.environ.get("STATUS", "unknown"),
          }
          slug = f"{cell['image_ext']}-sim{cell['runtime_version']}"
          fname = f"cell-{slug}.json"
          with open(fname, "w") as f:
              json.dump(cell, f, indent=2)
          print(json.dumps(cell, indent=2))
          PYEOF
        env:
          DIGEST:  "${{ env.DIGEST }}"
          SIZE_MB: "${{ env.SIZE_MB }}"
          STATUS:  "${{ env.STATUS }}"

      - name: Upload cell manifest artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           "cell-${{ matrix.image_ext }}-sim${{ matrix.runtime_version }}"
          path:           "cell-${{ matrix.image_ext }}-sim${{ matrix.runtime_version }}.json"
          retention-days: 30

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Clean up local images
        if: always()
        run: |
          docker rmi \
            "${{ steps.tags.outputs.ngc_nightly }}" \
            "${{ steps.tags.outputs.ngc_sha }}" \
            "${{ steps.tags.outputs.ghcr_nightly }}" \
            "${{ steps.tags.outputs.ghcr_sha }}" \
            2>/dev/null || true
          docker buildx prune --filter "until=48h" --force 2>/dev/null || true
          docker system prune --filter "until=48h" --force
          echo "Runner disk after cleanup:"
          df -h /


  # ---------------------------------------------------------------------------
  # JOB 3 · manifest
  # Aggregates all per-cell JSON artifacts into one manifest and writes
  # a Markdown build-matrix table to the workflow summary page.
  # ---------------------------------------------------------------------------
  manifest:
    name: "Aggregate manifest"
    needs: [setup, build]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      manifest_path: ${{ steps.agg.outputs.manifest_path }}
      passed:        ${{ steps.agg.outputs.passed }}
      failed:        ${{ steps.agg.outputs.failed }}
      total:         ${{ steps.agg.outputs.total }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}

      - name: Download cell manifest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "cell-*"
          path:    "cells/"

      - name: Aggregate manifests and write step summary
        id: agg
        env:
          BUILD_DATE:    ${{ needs.setup.outputs.build_date }}
          SHORT_SHA:     ${{ needs.setup.outputs.short_sha }}
          MANIFEST_PATH: "nightly-manifest-${{ needs.setup.outputs.build_date }}.json"
          CELLS_DIR:     "cells"
        run: python3 docker/scripts/aggregate-manifest.py

      - name: Upload nightly manifest
        uses: actions/upload-artifact@v4
        with:
          name:           "nightly-manifest-${{ needs.setup.outputs.build_date }}"
          path:           "nightly-manifest-${{ needs.setup.outputs.build_date }}.json"
          retention-days: 90


  # ---------------------------------------------------------------------------
  # JOB 4 · singularity-export
  # Pulls each freshly pushed NGC base image and converts it to .sif for HPC.
  # Runs only after a successful build; skipped on dry_run.
  # ---------------------------------------------------------------------------
  singularity-export:
    name: "Singularity [${{ matrix.sim_major_minor }}]"
    needs: [setup, build]
    runs-on: [self-hosted, singularity]
    if: >
      always() &&
      needs.build.result == 'success' &&
      github.event.inputs.dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_version: "4.5.0"
            sim_major_minor:   "4.5"
          - runtime_version: "5.0.0"
            sim_major_minor:   "5.0"
          - runtime_version: "5.1.0"
            sim_major_minor:   "5.1"
    timeout-minutes: 60

    steps:
      - name: Verify Apptainer / Singularity
        run: apptainer version 2>/dev/null || singularity version

      - name: Compute SIF name
        id: sif
        run: |
          TAG="nightly-${{ needs.setup.outputs.build_date }}-base-sim${{ matrix.sim_major_minor }}"
          SIF="isaaclab-${TAG}.sif"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sif=${SIF}" >> "$GITHUB_OUTPUT"

      - name: Pull NGC image → SIF
        env:
          APPTAINER_DOCKER_USERNAME: ${{ secrets.NGC_USERNAME }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.NGC_API_KEY }}
        run: |
          apptainer pull --force \
            "${{ steps.sif.outputs.sif }}" \
            "docker://nvcr.io/nvidia/isaac-lab:${{ steps.sif.outputs.tag }}"
          echo "SIF size: $(du -sh '${{ steps.sif.outputs.sif }}')"

      - name: Upload SIF to Azure Blob (HPC staging)
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload \
              --account-name "${{ secrets.HPC_STORAGE_ACCOUNT }}" \
              --account-key   "${{ secrets.HPC_STORAGE_KEY }}" \
              --container-name "isaaclab-hpc" \
              --name  "nightly/${{ needs.setup.outputs.build_date }}/${{ steps.sif.outputs.sif }}" \
              --file  "${{ steps.sif.outputs.sif }}" \
              --overwrite

      - name: Clean up SIF
        if: always()
        run: rm -f "${{ steps.sif.outputs.sif }}"


  # ---------------------------------------------------------------------------
  # JOB 5 · notify
  # Posts a Slack build report regardless of outcome.
  # ---------------------------------------------------------------------------
  notify:
    name: "Notify"
    needs: [setup, build, manifest]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download nightly manifest
        uses: actions/download-artifact@v4
        with:
          name: "nightly-manifest-${{ needs.setup.outputs.build_date }}"

      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "color=good"       >> "$GITHUB_OUTPUT"
            echo "icon=✅"          >> "$GITHUB_OUTPUT"
            echo "text=All passed"  >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "color=danger"     >> "$GITHUB_OUTPUT"
            echo "icon=❌"          >> "$GITHUB_OUTPUT"
            echo "text=${{ needs.manifest.outputs.failed }} cell(s) failed" >> "$GITHUB_OUTPUT"
          else
            echo "color=warning"    >> "$GITHUB_OUTPUT"
            echo "icon=⚠️"         >> "$GITHUB_OUTPUT"
            echo "text=Partial (${{ needs.build.result }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_NIGHTLY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.icon }} IsaacLab nightly — ${{ needs.setup.outputs.build_date }}",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "${{ steps.status.outputs.text }}",
                      "short": true
                    },
                    {
                      "title": "Cells",
                      "value": "${{ needs.manifest.outputs.passed }}/${{ needs.manifest.outputs.total }} passed",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "`${{ needs.setup.outputs.short_sha }}`",
                      "short": true
                    },
                    {
                      "title": "Run",
                      "value": "<https://github.com/isaac-sim/IsaacLab/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>",
                      "short": true
                    }
                  ],
                  "footer": "isaac-sim/IsaacLab · nightly pipeline",
                  "ts": "${{ github.run_id }}"
                }
              ]
            }
